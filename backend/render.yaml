services:
  - type: web
    name: document-intelligence-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./document_intelligence.db
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: MAX_UPLOAD_PAGES
        value: "3"
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: TESSERACT_CMD
        value: tesseract
      - key: FINANCIAL_TOLERANCE_PERCENT
        value: "1.0"
